# Test run: improved framework on breakfast_box
# 25 normal + 25 logical anomalies (no structural), seed=42
#
# Enabled improvements:
#   1 — programmatic semantic validation of Stage 3 candidates
#   2 — adaptive filter threshold based on n_shots
#   3 — consistency-weighted anomaly score in Stage 4
#   5 — multi-seed ensemble for Stage 3 (3 seeds)
#   6 — LLMJudge hallucination check in Stage 1
#
# Run:
#   .venv/bin/python3 scripts/run_pipeline.py \
#       --class_name breakfast_box \
#       --config config_improved_test_bb50.yaml \
#       --output_dir results_improved_test/breakfast_box \
#       --save_questions

vlm:
  backend: "internvl"
  internvl:
    model_name: "OpenGVLab/InternVL2_5-8B"
    temperature: 0.2
    top_p: 0.7
    repetition_penalty: 1.1
    do_sample: true
    max_new_tokens: 512
    device_map: "auto"

pipeline:
  n_shots: 5
  n_val_shots: 15                    # Fix A: separate validation set for Stage 3b
  n_questions: 8
  n_sub_questions: 5
  question_filter_threshold: 0.8   # Improvement 2 will adapt this based on n_shots
  ensemble_seeds: [42, 7, 13]       # Improvement 5: 3-seed ensemble for Stage 3
  use_llm_judge_hallucination: true  # Improvement 6: LLMJudge check in Stage 1
  anomaly_min_failures: 2            # Stage 4: declare anomaly when ≥K questions vote "No"
  question_generation_mode: "structured"  # Stage 3a: one question per Stage 2 bullet

dataset:
  name: "mvtec_loco"
  data_dir: "/home/chikibriki/LoqicQA/dataset-ninja/"
  download_if_missing: false

preprocessing:
  bpm:
    enabled: false   # breakfast_box does not use BPM
  langsam:
    enabled: false   # breakfast_box does not use LangSAM

output:
  results_dir: "results_improved_test"
  save_questions: true
  save_per_image: true

testing:
  mode: "specific"
  specific_samples:
