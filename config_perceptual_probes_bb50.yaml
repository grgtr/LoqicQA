# Run 14: perceptual probe sub-questions + visual grounding
# Replaces rephrase prompt with diverse visual angle probes (PRESENCE/ABSENCE/FEATURE/COUNT/SPATIAL)
# Base: feature/visual_grounding with all P1+P2+P3 fixes, no LLMJudge (GPU budget)

vlm:
  backend: "internvl"
  internvl:
    model_name: "OpenGVLab/InternVL2_5-8B"
    temperature: 0.2
    top_p: 0.7
    repetition_penalty: 1.1
    do_sample: true
    max_new_tokens: 512
    max_tiles: 4          # 22 GB GPU limit without LLMJudge
    device_map: "auto"

pipeline:
  n_shots: 5
  n_val_shots: 15
  n_questions: 8
  n_sub_questions: 5
  question_filter_threshold: 0.8
  ensemble_seeds: [42, 7, 13]
  use_llm_judge_hallucination: false
  anomaly_min_failures: 2
  question_generation_mode: "structured"
  use_grounded_reasoning: true
  sub_question_mode: "rephrase"   # uses new perceptual probe prompt

dataset:
  name: "mvtec_loco"
  data_dir: "/home/chikibriki/LoqicQA/dataset-ninja/"
  download_if_missing: false

preprocessing:
  bpm:
    enabled: false
  langsam:
    enabled: false

output:
  results_dir: "results/perceptual_probes_bb50"
  save_questions: true
  save_per_image: true

testing:
  mode: "specific"
  specific_samples:
