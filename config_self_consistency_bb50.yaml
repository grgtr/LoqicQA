# Self-consistency experiment on breakfast_box
# Ablation vs Run 10 (visual grounding + rephrase sub-questions):
#   sub_question_mode: "self_consistency" → ask the same main-Q 5x instead of rephrasing
#
# Hypothesis: LLM rephrasing introduces semantic drift; repeating the main-Q
# (self-consistency sampling at temp=0.2) gives cleaner majority vote signal.
#
# All other settings identical to config_visual_grounding_bb50.yaml.

vlm:
  backend: "internvl"
  internvl:
    model_name: "OpenGVLab/InternVL2_5-8B"
    temperature: 0.2
    top_p: 0.7
    repetition_penalty: 1.1
    do_sample: true
    max_new_tokens: 512
    device_map: "auto"

pipeline:
  n_shots: 5
  n_val_shots: 15
  n_questions: 8
  n_sub_questions: 5
  question_filter_threshold: 0.8
  ensemble_seeds: [42, 7, 13]
  use_llm_judge_hallucination: false  # saves ~6 GB: keyword filter handles constraints without LLM fallback
  anomaly_min_failures: 2
  question_generation_mode: "structured"
  use_grounded_reasoning: true
  sub_question_mode: "self_consistency"   # ← ablation: repeat main-Q instead of rephrase

dataset:
  name: "mvtec_loco"
  data_dir: "/home/chikibriki/LoqicQA/dataset-ninja/"
  download_if_missing: false

preprocessing:
  bpm:
    enabled: false
  langsam:
    enabled: false

output:
  results_dir: "results/self_consistency_bb50"
  save_questions: true
  save_per_image: true

testing:
  mode: "specific"
