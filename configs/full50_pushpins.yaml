# Full-pipeline run (all stages 1-4) on 50-image subset (25 good + 25 logical anomalies)
# Class: pushpins | decomposed Stage 1, structured Q-gen, RC4-A CoT, auto stage-3b filter
# Normality definition: rewritten (see logicqa/data/normality_definitions.py)
# Preprocessing: BPM=False (mesh background), LangSAM=off (breaks whole-image logical questions)

vlm:
  backend: "internvl"
  internvl:
    model_name: "OpenGVLab/InternVL2_5-8B"
    temperature: 0.2
    top_p: 0.7
    repetition_penalty: 1.1
    do_sample: true
    max_new_tokens: 512
    max_tiles: 12
    device_map: "auto"

pipeline:
  decomposed_description: true
  question_generation_mode: "structured"
  n_shots: 5
  n_val_shots: 15
  n_questions: 8
  n_sub_questions: 4
  question_filter_threshold: 0.8
  ensemble_seeds: [42]
  use_llm_judge_hallucination: false
  anomaly_min_failures: 1
  use_grounded_reasoning: false
  sub_question_mode: "rephrase"

dataset:
  name: "mvtec_loco"
  data_dir: "/home/chikibriki/LoqicQA/dataset-ninja/"
  download_if_missing: false

preprocessing:
  bpm:
    enabled: false
  langsam:
    enabled: false

output:
  results_dir: "results/full50_pushpins"
  save_questions: true
  save_per_image: true

testing:
  mode: "specific"
  specific_samples:
