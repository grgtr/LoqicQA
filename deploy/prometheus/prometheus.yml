global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: logicqa

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]

  - job_name: triton
    static_configs:
      - targets: [triton:8002]
    metrics_path: /metrics

  - job_name: preprocessing_service
    static_configs:
      - targets: [preprocessing:8000]
    metrics_path: /metrics
